# ============================================================================
# benchova — LLM benchmarking platform
# JorahOne
#
# Auto-discover models → Run multi-dimensional tests → Rank & score → Visualize
# The container collects system telemetry on start, then serves the dashboard
# on port 8081.
# ============================================================================

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/onebyjorah/benchova:latest
    container_name: benchova
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8081}:8081"
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal:11434}
      - DASHBOARD_PORT=8081
      - DASHBOARD_HOST=0.0.0.0
      - BENCH_SKIP_MEDIA=${BENCH_SKIP_MEDIA:-0}
    volumes:
      # Persist benchmark results
      - benchmark-data:/app/results
      # Mount Docker socket for container-aware benchmarks (optional)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  benchmark-data:
